.chip{display:inline-block;margin:4px 4px 0 0;padding:7px 12px;border-radius:16px;background:#fff;border:1px solid #ddd;font-size:13px;cursor:pointer}

.rm{background:#b9d3e8}
.row{display:flex;gap:6px;margin:8px 12px;align-items:flex-end}.row.me{flex-direction:row-reverse}
.bub{max-width:70%;padding:8px 12px;border-radius:16px;background:#fff;font-size:14px;line-height:1.4}
.me .bub{background:#fee500}
.av{width:34px;height:34px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:18px}
.sys{text-align:center;font-size:12px;color:#fff;background:rgba(0,0,0,.3);margin:10px auto;padding:4px 12px;border-radius:12px;width:max-content}

.btn{padding:11px 18px;border-radius:14px;font-weight:700;cursor:pointer;display:inline-block}
.li{padding:12px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.88);color:#fff;padding:8px 16px;border-radius:18px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.nt{margin:8px 14px;padding:12px 14px;cursor:pointer}
