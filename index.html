function beep(f,d,type,v,w){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(w||0);o.type=type||'sine';o.frequency.value=f;
 o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}

 lock:()=>{beep(880,.08,'sine',.05);beep(1320,.16,'sine',.05,.09)}};

function ivState(pid){if(!S.iv[pid]){const P=IV[pid];S.iv[pid]={r:0,asked:{},flag:false,fl:{},done:false,

function questApp(){
 if(!S.sub){return appWrap('조사',`<div class="stack"><div class="row" style="justify-content:space-between"><span class="small mute">신뢰도 · 잘못된 제시는 신뢰도를 깎는다</span><span class="hearts">${hearts()}</span></div>

 const P=IV[S.sub],iv=ivState(S.sub),rd=P.rounds[iv.r];
 const log=iv.log.map(l=>`<div class="${l.k}">${l.x}</div>`).join('');
 let ctl='';
 if(iv.done)ctl=`<div class="sysline">${S.sub==='sung'&&S.prs?'성화는 입을 닫았다.':'이 인물의 조사는 마쳤다.'}</div><button class="btn block" data-act="present">증거 제시</button>`;
 else if(rd.approach)ctl=`<h3>접근 방식</h3><div class="opts"><button class="btn" data-act="appr" data-m="prs">압박한다. “거짓말을 하고 계시죠.”</button><button class="btn" data-act="appr" data-m="emp">공감한다. “윤호 씨를 걱정하는 걸 압니다.”</button></div>`;
 else ctl=`<h3>질문</h3><div class="opts">${rd.qs.map(q=>`<button class="btn ${iv.asked[q.id]?'done':''}" data-act="ask" data-q="${q.id}" ${iv.asked[q.id]?'disabled':''}>${q.t}</button>`).join('')}</div><button class="btn block" style="margin-top:6px" data-act="present">증거 제시</button>`;
 return appWrap(P.n,`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="small mute">${P.role}</span><span class="hearts">${hearts()}</span></div><div class="ivlog">${log}</div><div class="stack">${ctl}</div>`)}

function ivAdvance(pid){const P=IV[pid],iv=ivState(pid),rd=P.rounds[iv.r];if(!rd.adv||!rd.adv(iv))return;
 if(iv.r<P.rounds.length-1){iv.r++;iv.flag=false;iv.asked={};const n=P.rounds[iv.r];iv.log.push({k:'sys',x:'— '+n.title+' —'});if(n.intro)iv.log.push({k:'npc',x:n.intro})}
 else{iv.done=true;if(pid==='han')iv.log.push({k:'sys',x:'한도현은 변호사를 부르겠다며 자리를 떠났다.'})}}
function ivAsk(qid){const P=IV[S.sub],iv=ivState(S.sub),q=P.rounds[iv.r].qs.find(x=>x.id===qid);if(!q||iv.asked[qid])return;
 iv.asked[qid]=1;iv.log.push({k:'you',x:q.t},{k:'npc',x:q.r});if(q.note)S.notes[q.note]=true;sfx.tap();ivAdvance(S.sub)}
function ivPresent(cid){const pid=S.sub,P=IV[pid],iv=ivState(pid),rd=P.rounds[iv.r];
 iv.log.push({k:'you',x:`「${CLUES[cid].t}」를 제시했다.`});
 if(iv.done||!rd.pres){iv.log.push({k:'npc',x:'더 드릴 말씀 없어요.'});sfx.tap();return}
 const pr=rd.pres[cid];
 if(pr===undefined){const w={sung:'그게 이 일과 무슨 관련이죠?',sera:'그게 뭔데요? 잘 모르겠어요.',han:'이게 저와 무슨 상관입니까.'}[pid];
  iv.log.push({k:'npc',x:w});mistake('관련 없는 증거를 제시했다');return}
 const o=typeof pr==='string'?{r:pr}:pr;iv.log.push({k:'npc',x:o.r});sfx.tap();
 if(o.adv)iv.flag=true;if(o.f){iv.fl[o.f]=1}
 if(o.leak){S.leaked=true;iv.log.push({k:'sys',x:'한도현이 “월포”라는 말에 반응했다. 수사 정보를 흘린 것일지도 모른다.'});sfx.bad()}
 if(o.give){if(gain(o.give))iv.flag=true}
 ivAdvance(pid)}
function ivApproach(m){const iv=ivState('sung');
 if(m==='emp'){iv.log.push({k:'you',x:'윤호 씨를 걱정하는 걸 압니다. 말해주실 수 있나요.'},{k:'npc',x:IV.sung.rounds[2].emp});S.emp=true;S.pwHint=true;S.notes.pw=true;toast('성화가 입을 열었다. 메모가 추가됐다.');sfx.clue()}
 else{iv.log.push({k:'you',x:'거짓말을 하고 계시죠. 솔직히 말하세요.'},{k:'npc',x:IV.sung.rounds[2].prs});S.prs=true;mistake('압박은 통하지 않았다')}
 iv.done=true}

function nextHint(){const c=id=>S.clues[id],o=id=>openIds().includes(id);
 if(!c('C02'))return'윤호 폰의 톡톡부터 열어봐. 성화와의 마지막 메시지에 단서가 있을 거야.';
 if(!c('C01'))return'사건 파일의 신고서를 꼼꼼히 읽어. 현장 상황이 중요해.';
 if(!c('C04'))return'톡톡에서 한도현 팀장과의 대화를 열어봐. 누가 윤호를 압박했는지 보일 거다.';
 if(!c('C05'))return'모아 마지막 게시물 사진을 자세히 봐. 간판 글자를 확인해.';
 if(!o('board'))return'단서를 더 모아야 새 앱이 열려. 톡톡의 다른 대화도 훑어봐.';
 if(!c('C06'))return'이웃광장의 “새벽3시” 글과 윤호의 닉네임을 대조해봐.';
 if(!c('C08')&&o('pay'))return'결제 내역에서 새벽 시간대를 봐. 어디로 갔는지 나온다.';
 if(!c('C12'))return'오세린에게 한도현의 협박 메시지를 보여줘. 조사 앱의 증거 제시 기능을 써.';
 if(!c('C09')&&o('map'))return'지도의 최근 검색 기록을 확인해.';
 if(!c('C10')&&o('mail'))return'메일에 잠긴 백업 파일이 있어. 비밀번호는 두 사람의 기념일이다. 성화의 조사 3차가 열쇠야.';
 if(Object.keys(S.links).length<4)return'수첩의 추리 탭에서 단서 두 개를 이어봐. 가짜 단서가 섞여 있으니 조심해. 성화를 의심하게 만드는 건 대부분 함정이다.';
 return'충분히 모았다. 최종 판단으로 가자. 한도현에게 월포 얘기를 흘리면 안 돼.'}

/* ===== 최종 판단 / 엔딩 ===== */
const LOCS=[{id:'wolpo',n:'월포 파도여관'},{id:'hap',n:'합정 작업실 일대'},{id:'sang',n:'상수동 성화 집 근처'},{id:'han',n:'한울프로덕션 사옥'}];
function finalHTML(){const f=S.fin,n=Object.keys(S.links).length;let b=`<div class="stack"><div class="card"><div class="row wrap" style="justify-content:space-between"><span>확보 단서 <b class="mono">${count()}/12</b></span><span>확정 사실 <b class="mono">${n}/5</b></span><span class="hearts">${hearts()}</span></div></div>`;
 if(!f.step){b+=`<h3>박성화 처분</h3><div class="opts"><button class="btn dng" data-act="fact" data-v="arrest">용의자로 체포한다</button><button class="btn" data-act="fact" data-v="protect">보호 대상으로 두고 윤호를 수색한다</button><button class="btn" data-act="fact" data-v="close">단서가 부족하다. 조사를 종결한다</button></div>`}
 else if(f.step===1){b+=`<h3>수색 지점</h3><p class="small mute">단서를 근거로 한 곳만 고른다.</p><div class="opts">${LOCS.map(l=>`<button class="btn" data-act="loc" data-v="${l.id}">${l.n}</button>`).join('')}</div>`}
 return`<div class="scr">${status()}<div class="hdr"><button class="back" data-act="back" aria-label="뒤로">←</button><h2>최종 판단</h2></div><div class="body">${b}</div></div>`}
function calcEnding(){const f=S.fin,n=Object.keys(S.links).length;
 if(f.act==='arrest')return{k:'C',w:'arrest'};if(f.act==='close')return{k:'B',w:'close'};
 if(f.loc!=='wolpo')return{k:'C',w:'site'};
 if(n>=4&&S.bad<=2&&!S.leaked)return{k:'A'};return{k:'B',w:S.leaked?'leak':'weak'}}
const WHY={arrest:'체포 영장은 단서 하나가 아니라 오해 위에 서 있었다.',close:'조사를 종결한 밤, 윤호의 어머니는 경찰서 앞에 오래 서 있었다.',site:'수색 지점이 틀렸다. 월포라는 이름은 단서 안에 있었다.',leak:'한도현이 먼저 움직였다는 걸 나중에야 알았다. 월포라는 단서를 흘린 탓이다.',weak:'단서를 한 단계만 더 이었다면 하루 일찍 도착했을 것이다.'};
function endingHTML(){const e=calcEnding(),E=ENDINGS[e.k],tot=Math.floor(elapsed()/1000);
 const extra=e.k==='A'&&S.emp?'<p>조사실에서 입을 열어준 성화가 없었다면 이 새벽은 오지 않았을지도 모른다.</p>':(WHY[e.w]?`<p>${WHY[e.w]}</p>`:'');
 return`<div class="scr end"><div class="body"><span class="stamp ${e.k==='A'?'':'red'}">${E.code}</span><h1>${E.name}</h1>
 <div class="txt">${E.txt.map(t=>`<p>${t}</p>`).join('')}${extra}</div>
 <div class="stats" style="margin:24px 0"><div class="card"><b>${count()}/12</b><span>확보 단서</span></div><div class="card"><b>${pad(Math.floor(tot/60))}:${pad(tot%60)}</b><span>소요 시간</span></div><div class="card"><b>${Object.keys(S.links).length}/5</b><span>확정 사실</span></div></div>
 <div class="stack"><button class="btn pri block" data-act="restart">다시 하기</button><button class="btn block" data-act="endhint">다른 엔딩 힌트</button><button class="btn block" data-act="toTitle">메인으로</button></div></div></div>`}

/* ===== 행동 처리 ===== */
function startGame(){prolT.forEach(clearTimeout);const m=muted;S=fresh();S.screen='PROLOGUE';muted=m;clearSave();render()}
function act(a,d){
 if(a!=='mute'&&a!=='pskip')sfx.tap();
 switch(a){
 case'new':startGame();return;
 case'cont':{const sv=loadSave();if(sv){S=Object.assign(fresh(),sv);S.t0=Date.now();S.app=S.app||null;render()}return}
 case'mute':muted=!muted;try{localStorage.setItem(MUTE_KEY,muted?'1':'0')}catch(e){}render();return;
 case'pskip':skipPrologue();return;
 case'begin':S.screen='HOME';S.t0=Date.now();save();break;
 case'open':{const ap=APPS.find(x=>x.id===d.id);if(count()<ap.need){toast(`단서 ${ap.need}개를 모으면 열립니다`);sfx.bad();return}
  S.newApps=S.newApps.filter(x=>x!==d.id);S.screen='APP';S.app=d.id;S.sub=null;sfx.open();break}
 case'back':if(S.screen==='APP'){if(S.sub){S.sub=null;S.pwBuf=''}else{S.app=null;S.screen='HOME'}}else if(S.screen==='FINAL'&&S.fin.step){S.fin={}}else S.screen='HOME';break;
 case'notebook':S.screen='NOTEBOOK';S.sel=[];break;
 case'ntab':S.tab=d.t;S.sel=[];break;
 case'sel':{const c=d.c,i=S.sel.indexOf(c);if(i>=0)S.sel.splice(i,1);else{if(S.sel.length>=2)S.sel.shift();S.sel.push(c)}break}
 case'link':doLink();break;
 case'hint':{if(S.hints<=0){toast('힌트를 모두 사용했다',true);return}S.hints--;modal(`<span class="stamp">김 반장 · 메신저</span><p style="margin:12px 0 18px;font-size:16px">${nextHint()}</p><button class="btn block" data-act="close">알겠습니다 (남은 힌트 ${S.hints})</button>`);save();render();return}
 case'close':closeModal();return;
 case'chat':S.sub=d.id;break;
 case'recover':S.rec=true;sfx.clue();break;
 case'ptab':S.ptab=d.t;break;
 case'mail':S.sub=d.id;break;
 case'pwopen':S.sub='pw';S.pwBuf='';break;
 case'key':{const k=d.k;if(k==='x')S.pwBuf=S.pwBuf.slice(0,-1);else if(k==='o'){if(S.pwBuf.length<4){toast('4자리를 입력하세요',true);return}pwCheck();break}else if(S.pwBuf.length<4)S.pwBuf+=k;if(S.pwBuf.length===4){pwCheck()}break}
 case'cstep':S.cmin=Math.max(0,Math.min(240,S.cmin+(+d.d)));break;
 case'person':{const P=IV[d.id];if(count()<P.need){toast(`단서 ${P.need}개를 모으면 조사할 수 있다`);sfx.bad();return}S.sub=d.id;break}
 case'ask':ivAsk(d.q);break;
 case'present':{const f=CLUE_IDS.filter(i=>S.clues[i]);if(!f.length){toast('제시할 단서가 없다');return}
  modal(`<h3>제시할 증거</h3><div class="chips" style="margin:12px 0 16px">${f.map(i=>`<button class="chip" data-act="pick" data-c="${i}">#${num(i)} ${CLUES[i].t}</button>`).join('')}</div><button class="btn block" data-act="close">취소</button>`);return}
 case'pick':closeModal();ivPresent(d.c);break;
 case'appr':ivApproach(d.m);break;
 case'final':S.screen='FINAL';S.fin={};break;
 case'fact':S.fin={act:d.v,step:d.v==='protect'?1:2};if(d.v!=='protect'){endNow();return}break;
 case'loc':S.fin.loc=d.v;S.fin.step=2;endNow();return;
 case'restart':startGame();return;
 case'toTitle':S=fresh();render();return;
 case'endhint':{const e=calcEnding().k;modal(`<h3>엔딩 힌트</h3><div class="stack" style="margin:12px 0 18px">${['A','B','C'].filter(k=>k!==e).map(k=>`<div class="card"><span class="stamp ${k==='A'?'':'red'}">${ENDINGS[k].code}</span><p class="small" style="margin-top:8px">${END_HINT[k]}</p></div>`).join('')}</div><button class="btn block" data-act="close">닫기</button>`);return}
 }
 render();save()}
function endNow(){S.screen='ENDING';clearSave();sfx.lock();render()}
function pwCheck(){if(S.pwBuf==='0314'){S.pw=true;S.sub='m3';S.pwBuf='';sfx.lock();toast('잠금 해제 · 첨부파일이 열렸다');}
 else{S.pwFails++;S.pwBuf='';S.shk=true;sfx.bad();buzz([50,30,50]);if(S.pwFails>=3){S.pwHint=true;toast('비밀번호가 틀렸다. 힌트가 열렸다',true)}else toast('비밀번호가 틀렸다',true)}
 render();save()}

/* ===== 입력 연결 / 시작 ===== */
function onHot(el){if(el.dataset.note){const n=el.dataset.note;if(!S.notes[n]){S.notes[n]=true;sfx.clue();toast('메모 · 윤호는 02:41 혼자 집을 나섰다');render();save()}return}
 const id=el.dataset.clue;if(S.clues[id]){toast('이미 확보한 단서다');return}gain(id);render()}
function boot(){S=fresh();$('#modal').hidden=true;
 $('#app').addEventListener('click',e=>{const h=e.target.closest('.hot');if(h&&$('#stage').contains(h)){onHot(h);return}
  const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset)});
 $('#app').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('hot')){e.preventDefault();onHot(e.target)}});
 $('#app').addEventListener('input',e=>{if(e.target.id==='cctv-range'){S.cmin=+e.target.value;$('#camsvg').innerHTML=cctvInner(S.cmin);$('#camts').textContent='CAM-02 '+camTime(S.cmin);markFound($('#camsvg'))}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
 render()}
boot();

</script>

</body></html>
