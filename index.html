async function cameraStart(){
  const video=document.getElementById('camera-video');
  if(!video||!navigator.mediaDevices?.getUserMedia)return;
  cameraStop();
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cameraFacing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=cameraStream;
  }catch(e){}
}
function cameraStop(){camN=0;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}}
const CAM_N=8,CAM_GAP=4000;let camN=0,camT=0;
function camCount(){const t=Date.now();camN=(t-camT<=CAM_GAP)?camN+1:1;camT=t;if(camN>=CAM_N){camN=0;try{const id=CLUE_IDS.find(i=>CLUES[i].real&&!S.clues[i]);if(id)gain(id);else toast('더 얻을 단서가 없습니다')}catch(e){}}}
function cameraShot(){
  camCount();
  const video=document.getElementById('camera-video'),canvas=document.getElementById('camera-canvas');
  if(!video||!canvas||!video.videoWidth)return;
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  try{if(typeof phAddData==='function')phAddData(canvas.toDataURL('image/jpeg',.85),false)}catch(e){}
  try{const t=document.getElementById('cam-thumb');if(t)t.style.backgroundImage='url('+canvas.toDataURL('image/jpeg',.4)+')'}catch(e){}
  const view=document.querySelector('.camera-view');
  if(view){view.classList.add('camera-captured');setTimeout(()=>view.classList.remove('camera-captured'),160);}
}
document.addEventListener('click',e=>{const t=e.target,b=t.closest&&t.closest('.cam-zoom button,.camera-modes button,#cam-flash');
 if(b){if(b.id==='cam-flash'){b.style.opacity=b.style.opacity==='.4'?'1':'.4';return}
  const g=b.parentNode;g.querySelectorAll('button').forEach(x=>x.classList.remove(b.closest('.cam-zoom')?'on':'active'));b.classList.add(b.closest('.cam-zoom')?'on':'active');
  if(b.dataset.z){const v=document.getElementById('camera-video');if(v)v.style.transform='scale('+b.dataset.z+')'}return}
 const v=t.closest&&t.closest('#cam-view');if(v&&!t.closest('button')){const r=v.getBoundingClientRect(),f=document.getElementById('cam-focus');f.style.left=(e.clientX-r.left)+'px';f.style.top=(e.clientY-r.top)+'px';f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}});
async function cameraSwitch(){cameraFacing=cameraFacing==='environment'?'user':'environment';await cameraStart();}
