function desktop(){root.innerHTML=`<section id="desktop" class="screen"><div class="wall"></div><div class="icons" id="icons"></div><div class="taskbar"><button class="start" onclick="showSystem()">▦</button><div class="openapps" id="openapps"></div><div class="status"><span class="hideMob">◉ 온라인</span><span>⌁ 86%</span><span id="clock"></span></div></div></section>`;renderIcons();clock();setInterval(clock,1000);state.windows=[]}
function renderIcons(){const el=document.getElementById("icons");if(!el)return;el.innerHTML=DATA.apps.map(a=>{const locked=a.unlock>state.unlocked;return `<button class="deskicon ${locked?"locked":""}" onclick="${locked?"lockedApp()":"openWindow('"+a.id+"')"}"><span class="ico">${a.icon}</span><span>${a.name}</span></button>`}).join("")}
function lockedApp(){beep("wrong");toast("아직 접근 권한이 없습니다. 다른 기록을 먼저 확인하세요.")}
function clock(){const e=document.getElementById("clock");if(e)e.textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function openWindow(id){if(state.windows.includes(id)){document.getElementById("win-"+id)?.classList.remove("minimized");return}state.windows.push(id);renderWindow(id);renderTasks();beep()}
function closeWindow(id){document.getElementById("win-"+id)?.remove();state.windows=state.windows.filter(x=>x!==id);renderTasks()}
function minimizeWindow(id){document.getElementById("win-"+id)?.classList.toggle("minimized")}
function renderTasks(){const e=document.getElementById("openapps");if(e)e.innerHTML=state.windows.map(id=>{const a=DATA.apps.find(x=>x.id===id);return `<button class="task" onclick="minimizeWindow('${id}')">${a?.icon||"▣"} ${a?.name||id}</button>`}).join("")}
function renderWindow(id){const a=DATA.apps.find(x=>x.id===id);const w=document.createElement("div");w.className="window";w.id="win-"+id;w.style.zIndex=String(100+state.windows.length);w.innerHTML=`<div class="titlebar" onmousedown="dragStart(event,this.parentElement)"><b>${a.name}</b><div class="winbtns"><button onclick="minimizeWindow('${id}')">—</button><button onclick="closeWindow('${id}')">×</button></div></div><div class="winbody">${appHTML(id)}</div>`;document.getElementById("desktop").appendChild(w);renderTasks()}
let drag=null;function dragStart(e,w){if(innerWidth<701)return;drag={w,x:e.clientX,y:e.clientY,l:w.offsetLeft,t:w.offsetTop};document.onmousemove=dragMove;document.onmouseup=()=>{drag=null;document.onmousemove=null}}
function dragMove(e){if(!drag)return;drag.w.style.left=Math.max(0,drag.l+e.clientX-drag.x)+"px";drag.w.style.top=Math.max(0,drag.t+e.clientY-drag.y)+"px"}
function showSystem(){toast("수사 단말 · 현재 확보 단서 "+state.clues.length+"/12")}
function appHTML(id){
if(id==="case")return caseApp();

}

function presentClue(id){const c=DATA.clues.find(x=>x.id===id);if(!c)return;if(!c.truth){state.wrongPresent++;state.suspectTrust=Math.max(0,state.suspectTrust-12);beep("wrong");document.getElementById("win-investigate")?.classList.add("shake");toast("부적절한 단서 제시 · 신뢰도 하락");save();return}addClue(id);state.suspectTrust=Math.min(100,state.suspectTrust+5);if(currentInvest==="성화"&&id==="C12"){state.investRound=3;toast("성화가 숨기고 있던 이유를 털어놓았습니다.")}save()}

function openDeduction(){navigate("DEDUCTION")}
function deduction(){root.innerHTML=`<section id="deduction" class="screen"><div class="stage"><div class="apphead"><div><div class="eyebrow">EVIDENCE BOARD</div><h1>추리 보드</h1></div><button onclick="navigate('DESKTOP')">바탕화면</button></div><p class="muted">서로 연결되는 단서 2개를 선택하면 사실관계를 확정합니다. 현재 ${state.clues.length}/12.</p><div class="clues">${state.clues.map(id=>{const c=DATA.clues.find(x=>x.id===id);return `<div class="cluecard clickable ${state.selected.includes(id)?"selected":""}" onclick="selectClue('${id}')"><b class="mono">${id}</b><h3>${esc(c.title)}</h3><p class="small muted">${esc(c.desc)}</p></div>`}).join("")}</div><div class="connect"><span id="sel1">단서 1</span><b>↔</b><span id="sel2">단서 2</span><button class="primary" onclick="connectSelected()">연결 확정</button></div><div class="card"><b>인물별 의심도</b><div class="suspects"><div class="suspect">박성화 <strong style="float:right">${Math.max(0,62-state.suspectTrust/3)}%</strong><div class="meter"><i style="width:${Math.max(0,62-state.suspectTrust/3)}%"></i></div></div><div class="suspect">한도현 <strong style="float:right">71%</strong><div class="meter"><i style="width:71%"></i></div></div><div class="suspect">오세린 <strong style="float:right">18%</strong><div class="meter"><i style="width:18%"></i></div></div></div></div><button class="primary" onclick="goFinal()">최종 판단으로</button></div></section>`}
function selectClue(id){if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<2)state.selected.push(id);render()}
function connectSelected(){if(state.selected.length!==2){toast("단서 2개를 선택하세요.");beep("wrong");return}const[a,b]=state.selected;const ca=DATA.clues.find(x=>x.id===a),cb=DATA.clues.find(x=>x.id===b);if(ca.connect.includes(b)||cb.connect.includes(a)){if(!state.connections.some(x=>x.sort().join()===[a,b].sort().join()))state.connections.push([a,b]);toast("사실관계 연결 완료");beep("clue");}else{beep("wrong");toast("두 기록 사이의 직접적인 연결은 확인되지 않습니다.");}state.selected=[];save();render()}
function goFinal(){if(state.connections.length<2){toast("최소 2개의 사실관계 연결이 필요합니다.");return}navigate("FINAL")}

/* ==================== FINAL / ENDING ==================== */
function finalScreen(){root.innerHTML=`<section id="final" class="screen"><div class="stage"><div class="eyebrow">FINAL JUDGMENT</div><h1>최종 판단</h1><p>성화에 대한 조치와 수색 지점을 선택하세요.</p><div class="card"><h3>박성화에 대한 처리</h3><div class="finalchoices"><button onclick="finalPick('arrest')"><b>체포</b><br><small>공범 가능성을 우선한다</small></button><button onclick="finalPick('protect')"><b>보호·조사</b><br><small>진술을 신뢰하고 안전 확보</small></button><button onclick="finalPick('close')"><b>조사 종결</b><br><small>혐의가 없다고 판단</small></button></div></div><div class="card"><h3>수색 지점</h3><div class="finalchoices"><button onclick="finalPlace('2관후문')">하림산업 2관 후문</button><button onclick="finalPlace('윤호작업실')">윤호 작업실</button><button onclick="finalPlace('성화집')">성화 주거지</button></div></div><div id="finalState" class="hintbox">선택 대기 중</div></div></section>`}
let finalChoice=null,finalPlaceChoice=null;
function finalPick(x){finalChoice=x;updateFinalState()}
function finalPlace(x){finalPlaceChoice=x;updateFinalState()}
function updateFinalState(){const e=document.getElementById("finalState");if(!e)return;e.innerHTML=`처리: <b>${finalChoice||"미선택"}</b> · 수색: <b>${finalPlaceChoice||"미선택"}</b>${finalChoice&&finalPlaceChoice?'<br><button class="primary" style="margin-top:10px" onclick="finishGame()">수색 지시 실행</button>':""}`}
function finishGame(){state.endTime=Date.now();let ending;if(finalChoice==="protect"&&finalPlaceChoice==="2관후문"&&state.clues.length>=10&&state.connections.length>=3&&state.suspectTrust>=55)ending="A";else if(finalChoice==="arrest"||finalPlaceChoice==="성화집"||state.wrongPresent>2)ending="C";else ending="B";state.ending=ending;save();navigate("ENDING")}
function ending(){const e=state.ending||"B";const info={A:["진실 — 마지막 접속 이후","윤호는 2관 후문 인근의 폐창고에 숨어 있었다. 자료를 외부에 넘기기 전까지 누구도 믿을 수 없었던 것이다. 성화는 공범이 아니었다. 보호 조치가 내려진 뒤 두 사람은 다시 만났다.","윤호의 위치를 정확히 짚었다."],B:["불완전 — 남겨진 기록","윤호의 흔적은 찾았지만 결정적인 몇 시간이 비어 있다. 사건의 큰 줄기는 밝혀졌으나 누가 마지막으로 윤호를 움직였는지는 아직 남았다.","일부 핵심 기록이 부족했다."],C:["오해 — 잘못된 접속","성화는 체포됐지만 윤호는 나타나지 않았다. 며칠 뒤 확보된 기록에서 성화가 윤호를 숨기려 했다는 사실이 드러난다. 수사는 가장 가까운 사람을 가장 먼저 의심하면서 방향을 잃었다.","레드헤링을 진실로 판단했다."]}[e];const sec=Math.max(0,Math.round(((state.endTime||Date.now())-(state.startTime||Date.now()))/1000));root.innerHTML=`<section id="ending" class="screen"><div class="endingbox"><div class="eyebrow">CASE CLOSED</div><h1>${info[0]}</h1><p>${info[1]}</p><div class="card"><b>수사 결과</b><p>단서 ${state.clues.length}/12 · 연결 ${state.connections.length}건 · 소요 시간 ${Math.floor(sec/60)}분 ${sec%60}초</p><p class="muted">${info[2]}</p></div><div class="actions"><button class="primary" onclick="newGame()">다시 하기</button><button onclick="showHint()">힌트 보기</button><button onclick="navigate('TITLE')">메인으로</button></div><div id="endingHint"></div></div></section>`}
function showHint(){document.getElementById("endingHint").innerHTML='<div class="hintbox">힌트: '+DATA.hints.join(" · ")+'</div>'}
function newGame(){state={...DEFAULT,muted:state.muted,startTime:Date.now()};save();navigate("BOOT");setTimeout(()=>bootNext(0),100)}
function toggleMute(){state.muted=!state.muted;save();render()}

/* ==================== RENDER ==================== */
function render(){if(state.screen==="TITLE")title();else if(state.screen==="BOOT")boot();else if(state.screen==="LOGIN")login();else if(state.screen==="DESKTOP")desktop();else if(state.screen==="DEDUCTION")deduction();else if(state.screen==="FINAL")finalScreen();else if(state.screen==="ENDING")ending();else title()}
load();if(state.screen==="ENDING")state.screen="TITLE";render();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.screen==="DESKTOP"){state.windows.forEach(closeWindow)}if(e.key==="d"&&e.ctrlKey){e.preventDefault();openDeduction()}});
</script>
</body>
</html>
